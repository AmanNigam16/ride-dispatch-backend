version: '3.8'

services:

  mongo:
    image: mongo:6
    ports:
      - "27018:27017"

  redis:
    image: redis:7

  auth-service:
    build: ./services/auth-service
    ports:
      - "5001:5001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      - mongo

  ride-service:
    build: ./services/ride-service
    ports:
      - "5002:5002"
    env_file:
      - ./services/ride-service/.env
    depends_on:
      - mongo
      - redis

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - ride-service